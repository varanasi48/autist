<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VR Flight Combat Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5d87a0;font-family:Arial}button{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 25px;border:0;border-radius:12px;font-size:18px;font-weight:bold}#fire{left:auto;top:auto;right:20px;bottom:20px;transform:none;display:none;background:#7b2418;color:white;border-radius:50%;width:80px;height:80px}#hud{position:fixed;z-index:2;inset:12px;color:white;text-shadow:0 2px 4px #000;pointer-events:none;font-size:13px}#status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#07121dcc;padding:8px 14px;border-radius:8px}#cross{position:fixed;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border:1px solid #bdf2ff;border-radius:50%}</style></head><body><button id="start">ENTER FLIGHT</button><button id="fire">FIRE</button><div id="hud">ALT 12,400 m<br>SPEED 720 km/h<br>MISSION: CLEAR THE TRAINING ZONE<br>TARGETS: <span id="score">0</span><div id="cross"></div><div id="status">Waiting to enter flight</div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const S=new THREE.Scene();S.background=new THREE.Color(0x7fa9c2);S.fog=new THREE.Fog(0x7fa9c2,80,500);const C=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,700);C.position.set(0,2,10);const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.shadowMap.enabled=true;document.body.appendChild(R.domElement);S.add(new THREE.HemisphereLight(0xbfe8ff,0x34402f,2));let sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-80,120,40);S.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x52643d}));ground.rotation.x=-Math.PI/2;ground.position.y=-8;S.add(ground);for(let i=0;i<24;i++){let h=15+Math.random()*40,m=new THREE.Mesh(new THREE.ConeGeometry(20+Math.random()*25,h,7),new THREE.MeshStandardMaterial({color:0x435143}));m.position.set((Math.random()-.5)*500,h/2-8,-80-Math.random()*350);S.add(m)}let cockpit=new THREE.Group(),dm=new THREE.MeshStandardMaterial({color:0x182127,metalness:.7,roughness:.35});function bar(x,y,z,a,b,c){let q=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),dm);q.position.set(x,y,z);cockpit.add(q)}bar(-3,-1.1,-2.4,.35,2.8,.35);bar(3,-1.1,-2.4,.35,2.8,.35);bar(0,-1.8,-2.1,6.2,.3,.35);S.add(cockpit);let targets=[],score=0;function target(){let g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(2.1,16,12),new THREE.MeshStandardMaterial({color:0x78848f,metalness:.7})));let w=new THREE.Mesh(new THREE.BoxGeometry(6,.18,1),dm);g.add(w);g.userData.hp=3;return g}for(let i=0;i<5;i++){let t=target();t.position.set((Math.random()-.5)*70,5+Math.random()*22,-65-i*45);S.add(t);targets.push(t)}let active=false;function fire(){if(!active)return;let d=new THREE.Vector3(0,0,-1).applyQuaternion(C.quaternion).normalize(),best=null,bd=1e9;for(let t of targets){if(t.userData.hp<=0)continue;let v=t.position.clone().sub(C.position),a=v.dot(d);if(a<0)continue;let miss=C.position.clone().add(d.clone().multiplyScalar(a)).distanceTo(t.position);if(miss<5&&a<bd){best=t;bd=a}}if(best){best.userData.hp--;best.scale.multiplyScalar(.86);if(best.userData.hp<=0){best.visible=false;score++;document.getElementById('score').textContent=score;document.getElementById('status').textContent='Target cleared'}else document.getElementById('status').textContent='Hit — keep aiming'}else document.getElementById('status').textContent='Miss'}document.getElementById('fire').onclick=fire;addEventListener('keydown',e=>{if(e.code==='Space')fire()});let base=new THREE.Quaternion(),drag=false,lx=0,ly=0;function orient(e){let q=new THREE.Quaternion().setFromEuler(new THREE.Euler((e.beta||0)*Math.PI/180,(e.alpha||0)*Math.PI/180,-(e.gamma||0)*Math.PI/180,'YXZ'));C.quaternion.copy(base).multiply(q)}addEventListener('deviceorientation',orient,true);R.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;C.rotation.y-=(e.clientX-lx)*.004;C.rotation.x-=(e.clientY-ly)*.004;lx=e.clientX;ly=e.clientY});document.getElementById('start').onclick=async()=>{active=true;document.getElementById('start').style.display='none';document.getElementById('fire').style.display='block';document.getElementById('status').textContent='Flight active — aim and FIRE';if(DeviceOrientationEvent?.requestPermission){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}base.copy(C.quaternion).invert()};addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(active)for(let t of targets){t.position.z+=dt*18;t.rotation.y+=dt*.18;if(t.position.z>25){t.position.z=-300-Math.random()*120;t.position.x=(Math.random()-.5)*100;t.userData.hp=3;t.visible=true;t.scale.setScalar(1)}}R.render(S,C)}loop();</script></body></html>
